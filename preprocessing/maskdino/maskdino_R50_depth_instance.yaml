_BASE_: ../../coco/instance-segmentation/maskdino_R50_bs16_50ep_3s_dowsample1_2048_bitmask.yaml

MODEL:
  WEIGHTS: "detectron2://ImageNetPretrained/torchvision/R-50.pkl"
  PIXEL_MEAN: [127.5, 127.5, 127.5]
  PIXEL_STD: [127.5, 127.5, 127.5]
  SEM_SEG_HEAD:
    NUM_CLASSES: 2
  MaskDINO:
    INITIALIZE_BOX_TYPE: "bitmask"

DATASETS:
  TRAIN: ("pig_depth_combined_train",)
  TEST: ("pig_depth_combined_val",)

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.00005
  MAX_ITER: 10000
  STEPS: (8000, 9000)
  CHECKPOINT_PERIOD: 1000

INPUT:
  FORMAT: "RGB"
  DATASET_MAPPER_NAME: "coco_instance_detr"
  RANDOM_FLIP: "horizontal"
  CROP:
    ENABLED: False
  MIN_SIZE_TRAIN: (576,)
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 576
  MAX_SIZE_TEST: 640

TEST:
  DETECTIONS_PER_IMAGE: 2
  EVAL_PERIOD: 1000

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: True
  NUM_WORKERS: 4

OUTPUT_DIR: "./output/pig_depth_r50_instance"
