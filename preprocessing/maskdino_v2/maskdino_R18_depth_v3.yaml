# MaskDINO v3 — fast depth segmenter for pig + upper-body.
#
# Architectural deltas vs v2 (maskdino_R50_depth_v2.yaml):
#   * Backbone: R50 -> R18  (smaller, faster; main inference saving).
#   * NUM_OBJECT_QUERIES: 10 -> 50  (gives queries slack to learn "no object"
#     on empty frames instead of confidently inventing tiny pig blobs).
#   * DEC_LAYERS: 3 -> 5  (more refinement passes; was overcut in v2).
#   * DN_NUM: 20 -> 100  (proportional to query budget).
#   * FILTER_EMPTY_ANNOTATIONS: True -> False  (so negative frames added
#     in pig_depth_combined_v3 reach training; this is the dataset-side
#     fix for v2's false-positive problem).
#
# Same as v2:
#   * 1-channel raw depth input (raw_meters_1ch).
#   * Custom mapper "depth_1ch_instance".
#   * 2 semantic classes: pig + pig_upper_body.
#   * PIXEL_MEAN/STD inherited from aligned data; if you add many negatives
#     and the empirical mean/std drift > 5%, recompute on the v3 train pool.
#
# Expected S1 inference latency on H200, batch=1, 576x640: ~15-20 ms
# (was 63 ms with R50; R18 stem + 2x smaller feature pyramid is the main
# win, the rest comes from fewer dec layers).
#
# Weights init: scripts/make_r18_1ch_pkl.py writes
#   /mnt/gs21/scratch/basharmk/data/unl/MaskDINO/weights/r18_conv1_1ch.pkl
# Use that as MODEL.WEIGHTS.

_BASE_: ../../coco/instance-segmentation/maskdino_R50_bs16_50ep_3s_dowsample1_2048_bitmask.yaml

MODEL:
  WEIGHTS: "/mnt/gs21/scratch/basharmk/data/unl/MaskDINO/weights/r18_conv1_1ch.pkl"
  # Length-1 PIXEL_MEAN automatically gives a 1-channel conv1 in this D2.
  PIXEL_MEAN: [2.0208]
  PIXEL_STD:  [0.4158]
  RESNETS:
    DEPTH: 18
    STRIDE_IN_1X1: False  # standard torchvision convention; matches the conv1_1ch.pkl
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    RES2_OUT_CHANNELS: 64  # R18 has 64/128/256/512 channels (vs R50's 256/512/1024/2048)
  SEM_SEG_HEAD:
    NUM_CLASSES: 2
  MaskDINO:
    INITIALIZE_BOX_TYPE: "bitmask"
    NUM_OBJECT_QUERIES: 50
    DEC_LAYERS: 5
    DN: "seg"
    DN_NUM: 100
    ENDPOINT_ON: True
    ENDPOINT_WEIGHT: 2.0
    ENDPOINT_SMOOTH_L1_BETA: 0.05

DATASETS:
  TRAIN: ("pig_depth_v3_train",)
  TEST: ("pig_depth_v3_val",)

SOLVER:
  IMS_PER_BATCH: 8        # R18 fits more per GPU than R50
  BASE_LR: 0.0001         # 2x v2 (smaller backbone, more queries -> slightly higher LR)
  MAX_ITER: 12000         # ~80 epochs at IMS_PER_BATCH=8 over 1300+ samples; cushion for negs
  STEPS: (9600, 11000)
  CHECKPOINT_PERIOD: 1000

INPUT:
  FORMAT: "L"
  DATASET_MAPPER_NAME: "depth_1ch_instance"
  RANDOM_FLIP: "horizontal"
  CROP:
    ENABLED: False
  MIN_SIZE_TRAIN: (576,)
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 576
  MAX_SIZE_TEST: 640

TEST:
  DETECTIONS_PER_IMAGE: 2
  EVAL_PERIOD: 1000

DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False   # crucial: keep negative frames in training
  NUM_WORKERS: 4

OUTPUT_DIR: "./output/pig_depth_v3_endpoint"
