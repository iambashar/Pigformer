[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pigformer"
version = "0.1.0"
description = "Transformer for pig body-condition regression from Azure Kinect depth height maps."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mk Bashar" },
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "h5py>=3.8",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.7", "scikit-learn>=1.3"]

[tool.setuptools]
py-modules = ["dataset", "models", "split", "train", "evaluate", "evaluate_ensemble"]
